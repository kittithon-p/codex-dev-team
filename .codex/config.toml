model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
GRAFANA_URL = "https://grafana.np-nayoo.co/"

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800

[mcp_servers.grafana]
command = "/Users/kitti/go/bin/mcp-grafana"
env_vars = [
    "GRAFANA_URL",
    "GRAFANA_API_KEY",
]
